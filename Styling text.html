<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Styling text</title>
<style>
    h1 {
        color: orange;
        font-family: Garamond, "Times New Roman", serif;
    }

    h2 {
        font-family: Verdana, sans-serif;
        text-align: right;
    }

    p {
        font-family: Verdana, sans-serif;
        font-size: 20px;
    }

    
    .second {
        font-family: "Courier New", monospace;
        color: #555;
        text-align: right;
    }
</style>
</head>
<body>

<h1>Styling text</h1>

<h2>Heading Num. 2</h2>

<p>My first paragraph.</p>

<p class="second">My second paragraph.</p>

</body>
</html>
