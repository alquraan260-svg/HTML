<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Desktop and Mobile Layout</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      background: #fff;
      padding: 12px;
    }

    .wrapper {
      max-width: 580px;
      border: 1px solid #e5e7eb;
      border-radius: 10px;
      padding: 12px;
    }

    h3 {
      font-size: 13px;
      font-weight: 600;
      color: #111827;
      margin-bottom: 8px;
    }
    h3.second { margin-top: 10px; }

    .box {
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      border-radius: 6px;
      color: #fff;
      font-weight: 700;
      font-size: 14px;
    }

    .navbar  { background: #2563eb; height: 37px; }
    .main    { background: #0d9488; height: 37px; }
    .sidebar { background: #64748b; }

    .card {
      background: #dbeafe;
      color: #1e40af;
      font-size: 11px;
      font-weight: 400;
      height: 24px;
      border-radius: 5px;
    }

    .desktop {
      display: grid;
      grid-template-columns: 184px 1fr;
      grid-template-rows: 37px 37px 24px 1fr;
      gap: 3px;
      height: 177px;
    }
    .desktop .navbar  { grid-column: 1 / 3; grid-row: 1; }
    .desktop .sidebar { grid-column: 1;     grid-row: 2 / 5; }
    .desktop .main    { grid-column: 2;     grid-row: 2; }
    .desktop .cards {
      grid-column: 2;
      grid-row: 3;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 3px;
    }

    .mobile {
      display: flex;
      flex-direction: column;
      gap: 3px;
    }
  </style>
</head>
<body>

  <div class="wrapper">

    <h3>Desktop layout</h3>
    <div class="desktop">
      <div class="box navbar">NAVBAR</div>
      <div class="box sidebar">SIDEBAR</div>
      <div class="box main">MAIN CONTENT</div>
      <div class="cards">
        <div class="box card">Card 1</div>
        <div class="box card">Card 2</div>
        <div class="box card">Card 3</div>
      </div>
    </div>

    <h3 class="second">Mobile layout</h3>
    <div class="mobile">
      <div class="box navbar">NAVBAR</div>
      <div class="box main">MAIN CONTENT</div>
      <div class="box card">Course Card 1</div>
      <div class="box card">Course Card 2</div>
      <div class="box card">Course Card 3</div>
    </div>

  </div>

</body>
</html>
