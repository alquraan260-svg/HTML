<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Task 3 - Images In Tables</title>
<style>
    body {
        font-family: Arial, sans-serif;
    }
    table {
        border-collapse: collapse;
        width: 400px;
    }
    th, td {
        border: 1px solid gray;
        padding: 10px;
        text-align: center;
    }
    img {
        width: 150px;
        height: auto;
    }
</style>
</head>
<body>

<h1>This is Task (3)</h1>
<h2>Images In Tables</h2>
<hr>
<h3>What are your favourite pets?</h3>

<table>
    <tr>
        <th>Pet Image</th>
        <th>More Facts about (as a link)</th>
    </tr>
    <tr>
        <td><img src="horse.png" alt="horse"></td>
        <td><a href="https://en.wikipedia.org/wiki/Horse">Horse</a></td>
    </tr>
    <tr>
        <td><img src="dog.png" alt="dog"></td>
        <td><a href="https://en.wikipedia.org/wiki/Dog">Dogs</a></td>
    </tr>
    <tr>
        <td><img src="cat.png" alt="cat"></td>
        <td><a href="https://en.wikipedia.org/wiki/Cat">Cats</a></td>
    </tr>
</table>

</body>
</html>
