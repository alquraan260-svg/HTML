<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Weekly Schedule</title>
<style>
    table {
        border-collapse: collapse;
        width: 100%;
        text-align: center;
        font-family: Arial, sans-serif;
    }
    th, td {
        border: 1px solid black;
        padding: 8px;
    }
    .lunch {
        writing-mode: vertical-rl;
        text-orientation: upright;
        font-weight: bold;
    }
</style>
</head>
<body>

<table>
    <tr>
        <th>day/period</th>
        <th>I 9:30-10:20</th>
        <th>II 10:20-11:20</th>
        <th>III 11:20-12:00</th>
        <th>12:00-12:40</th>
        <th>IV 12:40-1:30</th>
        <th>V 1:30-2:20</th>
        <th>VI 2:20-3:10</th>
        <th>VII 3:10-4:00</th>
    </tr>

    <tr>
        <th>MONDAY</th>
        <td>ENG</td>
        <td>MAT</td>
        <td>CHE</td>
        <td rowspan="6" class="lunch">LUNCH</td>
        <td colspan="3">lab</td>
        <td>PHY</td>
    </tr>

    <tr>
        <th>tuesday</th>
        <td colspan="3">lab</td>
        <td>ENG</td>
        <td>CHE</td>
        <td>MAT</td>
        <td>SPORTS</td>
    </tr>

    <tr>
        <th>wednesday</th>
        <td>MAT</td>
        <td>PHY</td>
        <td>ENG</td>
        <td colspan="3">lab</td>
        <td>MAT</td>
    </tr>

    <tr>
        <th>thursday</th>
        <td>PHY</td>
        <td>ENG</td>
        <td>CHE</td>
        <td colspan="3">lab</td>
        <td>MAT</td>
    </tr>

    <tr>
        <th>friday</th>
        <td colspan="3">LAB</td>
        <td>MAT</td>
        <td>CHE</td>
        <td>ENG</td>
        <td>PHY</td>
    </tr>

    <tr>
        <th>saturday</th>
        <td>ENG</td>
        <td>CHE</td>
        <td>MAT</td>
        <td colspan="4">SEMINAR</td>
    </tr>

</table>

</body>
</html>
